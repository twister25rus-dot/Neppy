[package]
name = "tinymemory-bus"
# Not published, for the same reason `tinymemory-api` is not: the graph below it
# reaches crates that are not on crates.io. A host takes this by git or by path.
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/tinyhumansai/tinymemory"
description = "The TinyBus wire contract for the TinyMemory module: member names, payload types, and typed calls"

# Deliberately dependency-light: this is the crate a host links to talk to the
# loadable module, so it must cost that host almost nothing. Nothing here may
# pull in `rusqlite`, `git2`, `reqwest`, `regex`, an async runtime, or
# `tinybus` — see `src/lib.rs` for why the transport in particular is absent.
#
# The set is the same one the payload types carried when they lived in
# `tinymemory-api`, minus everything only the traits and the host config needed:
#
# - `chrono`   — timestamps on chunk, tree and retrieval nodes; the `serde`
#                feature backs `chunks::Metadata`'s `chrono::serde::ts_milliseconds`.
# - `sha2`     — the deterministic `chunks::chunk_id`.
# - `uuid`     — `tool_memory::ToolMemoryRule::generate_id` (v4 bytes, nibble
#                encoded).
# - `anyhow`   — `error::MemoryError::Other`, which carries an opaque cause.
# - `thiserror`— the `MemoryError` and `CapabilityError` enums.
#
# Guard with the FORWARD form, which is scoped to this package — `cargo tree -i`
# discards the `-p` scope and exits clean even when this crate is the one
# pulling the dependency in:
#
#   cargo tree -p tinymemory-bus -e normal,build --prefix none \
#     | grep -Ei 'rusqlite|libsqlite|git2|reqwest|regex|tokio|tinybus'   # expect no match
[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
# `pedantic` is deliberately not enabled, matching `tinymemory-tinycortex` and
# `tinymemory-remote`. These modules moved here verbatim from
# `tinymemory-api`, which carries no `[lints]` table at all; switching pedantic
# on over the move would bury a mechanical relocation under several hundred
# unrelated `#[must_use]` and backtick edits. Turning it on is worth doing — as
# its own commit, over `tinymemory-api` too, so the contract and the vocabulary
# stay lint-compatible.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
