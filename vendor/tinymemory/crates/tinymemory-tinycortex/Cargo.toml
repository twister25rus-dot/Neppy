[package]
name = "tinymemory-tinycortex"
# Not published: `tinymemory-core` depends on `tinycortex-api`, which is
# consumed by path and is not on crates.io, so `cargo package` cannot resolve
# the graph. Every consumer takes this repo by path or git.
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "TinyCortex engine adapter for the TinyMemory contract"
repository = "https://github.com/tinyhumansai/tinymemory"

[dependencies]
# The contract this adapter targets.
tinymemory-api = { path = "../tinymemory-api" }
# The diagnostic reads in `MemoryMaintenance` query TinyCortex's own tables
# directly, which is this crate's job — it exists to adapt that schema to the
# contract, and the schema is not something the contract can describe.
#
# Pinned to the exact version `tinymemory-core` uses, deliberately. `rusqlite`
# carries a `links` key through `libsqlite3-sys`, so two different versions in
# one graph is a hard cargo error rather than a silent duplicate; matching the
# pin makes cargo unify them onto the one bundled copy already present.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# The engine being adapted. A version requirement rather than a path, so a host
# that already pins its own TinyCortex checkout unifies both onto one copy
# through its `[patch.crates-io]`; the workspace root patches it to the nested
# `vendor/tinycortex` submodule for a standalone build. A path dependency here
# would defeat that and give a host two TinyCortex crates with two incompatible
# `Memory` traits.
tinycortex = { version = "0.1", default-features = false }
# The optional capability families lifted here in issue #18 §C3 delegate to
# `tinymemory-core` — that is where the summary tree, chunk store, entities,
# graph and diff ledger actually live. The synchronous-SQL families run on a
# blocking thread; the KV/graph accessors go through the client shim inline. Depending on it
# makes this adapter heavier than the mandatory-only version it replaces; §D
# feature-gates that weight once §A3 has removed the direct engine call sites
# core still has.
tinymemory-core = { path = "../tinymemory-core" }
# `spawn_blocking`: the families that run synchronous engine work (profile,
# episodic, goals — and, via `tinymemory-core`, the mandatory Memory methods)
# hop off the async executor rather than blocking it.
tokio = { version = "1", features = ["rt"] }
# Timestamps on ingest and diff records.
chrono = { version = "0.4", features = ["serde"] }
# The provider crosses a few value types by round-tripping them through JSON
# where the engine and the contract describe the same shape under two names —
# the duplication issue #18 §A1 exists to delete.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Person ids are UUIDs on the engine side.
uuid = { version = "1", features = ["v4"] }
# The engine reports a failed profile write through the `log` facade rather
# than returning it, so the host can decide what to do about it.
log = "0.4"

# `Memory` is an object-safe async trait.
async-trait = "0.1"
# The engine's trait surface is anyhow-typed.
anyhow = "1"

[dev-dependencies]
# The behavioural contract suite, run against this crate's drivers
# (issue #18 §E1, acceptance criterion 5).
tinymemory-conformance = { path = "../tinymemory-conformance" }
# The full-provider conformance target opens a real workspace store.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# `expect`/`panic` are denied in the library the same way the facade denies them.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"

[features]
default = []
# Git-backed diff snapshots, forwarded to `tinymemory-core`'s own gate. Off by
# default because it is what drags `git2` / `libgit2-sys` / `libz-sys` — a
# native build — into the graph. This adapter had no such dependency before
# issue #18 §C3 lifted the diff family here, and making it unconditional would
# hand every consumer a libgit2 build they never asked for.
#
# The gate reaches `capabilities()`: with the feature off the `Diff` family is
# neither advertised nor reachable, so `audit_provider` still passes. Advertising
# a family the build cannot serve is exactly what that audit exists to catch.
memory-git = ["tinymemory-core/memory-git"]
