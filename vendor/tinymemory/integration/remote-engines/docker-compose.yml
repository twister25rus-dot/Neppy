name: tinymemory-remote-engines

services:
  agentmemory:
    profiles: [agentmemory]
    build:
      context: https://github.com/rohitg00/agentmemory.git#v0.9.29
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY package.json .
        # The image's bundled npm (10.9.8) fails resolving this package.json
        # with "Cannot read properties of null (reading 'edgesOut')" — an
        # arborist bug, not a bad dependency: npm 11.12.1 resolves the exact
        # same file to 276 packages. It surfaced without any change here, on a
        # day when this job went from green at 10:47 to red at 15:39, because
        # the build has no lockfile and resolves against a registry that moves.
        # Pinned rather than floated for the same reason.
        RUN npm install -g npm@11.12.1 && npm install
        COPY . .
        RUN npm run build
        CMD ["node", "dist/index.mjs"]
    environment:
      III_ENGINE_URL: ws://agentmemory-engine:49134
      III_REST_PORT: "3111"
      AGENTMEMORY_AUTO_COMPRESS: "false"
      AGENTMEMORY_INJECT_CONTEXT: "false"
    depends_on:
      agentmemory-engine:
        condition: service_started

  agentmemory-engine:
    profiles: [agentmemory]
    image: iiidev/iii:0.11.2
    user: "65532:65532"
    ports: ["3111:3111", "49134:49134"]
    depends_on:
      agentmemory-init:
        condition: service_completed_successfully
    volumes:
      - ./agentmemory-iii-config.yaml:/app/config.yaml:ro
      - agentmemory-data:/data

  agentmemory-init:
    profiles: [agentmemory]
    image: busybox:1.36
    user: "0:0"
    volumes: ["agentmemory-data:/data"]
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /data && chmod 755 /data"]
    restart: "no"

  supermemory:
    profiles: [supermemory]
    build:
      context: .
      dockerfile: supermemory.Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-superrag-only}
      SUPERMEMORY_DATA_DIR: /data
      PORT: 6767
    ports: ["6767:6767"]
    volumes: ["supermemory-data:/data"]

  mem0:
    profiles: [mem0]
    build:
      context: https://github.com/mem0ai/mem0.git#d70cc00ab39ee09ddcd982581d24d6c435d4fc09:server
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt \
            && pip install --no-cache-dir "psycopg[binary]>=3.2,<4"
        RUN mkdir -p /app/history
        COPY . .
        EXPOSE 8000
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      AUTH_DISABLED: "true"
      JWT_SECRET: tinymemory-live-test-only
      OPENAI_API_KEY: ${OPENAI_API_KEY:-tinymemory-test}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mock-inference:8080/v1}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: tinymemory
      POSTGRES_DB: mem0_app
      APP_DB_NAME: mem0_app
      MEM0_TELEMETRY: "false"
    ports: ["8888:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      mock-inference:
        condition: service_healthy

  postgres:
    profiles: [mem0]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tinymemory
      POSTGRES_DB: mem0_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["mem0-postgres:/var/lib/postgresql/data"]

  cognee:
    profiles: [cognee]
    build:
      context: https://github.com/topoteretes/cognee.git#4b9dd362625dfd3621c344e571a86f5bc7a55ee8
      dockerfile: Dockerfile
    environment:
      LLM_API_KEY: ${OPENAI_API_KEY:-tinymemory-test}
      LLM_PROVIDER: openai
      LLM_MODEL: openai/gpt-5-mini
      LLM_ENDPOINT: ${OPENAI_BASE_URL:-http://mock-inference:8080/v1}
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: openai/text-embedding-3-small
      EMBEDDING_ENDPOINT: ${OPENAI_BASE_URL:-http://mock-inference:8080/v1}
      EMBEDDING_API_KEY: ${OPENAI_API_KEY:-tinymemory-test}
      EMBEDDING_DIMENSIONS: 1536
      GRAPH_DATABASE_PROVIDER: turso
      GRAPH_DATABASE_URL: /app/.cognee_system/graph.sqlite
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      REQUIRE_AUTHENTICATION: "false"
      TELEMETRY_DISABLED: "true"
    ports: ["8001:8000"]
    volumes: ["cognee-data:/app/.cognee_system"]
    depends_on:
      mock-inference:
        condition: service_healthy

  mock-inference:
    profiles: [mem0, cognee]
    build:
      context: .
      dockerfile: mock-inference.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  supermemory-data:
  mem0-postgres:
  cognee-data:
  agentmemory-data:
