<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Neppy app icon</title>
  <!-- Source of truth for the desktop/mobile app icons. Regenerate every size
       with:  cd app && node_modules/.bin/tauri icon public/brand/NeppyAppIcon.png
       Brand blue #2F6EF4 matches app/src/styles/tokens.css. -->
  <defs>
    <mask id="neppy-cat-icon">
      <rect width="300" height="300" fill="black"/>
      <circle cx="150" cy="186" r="92" fill="white"/>
      <polygon points="72,140 95,36 152,98" fill="white"/>
      <polygon points="228,140 205,36 148,98" fill="white"/>
      <circle cx="119" cy="180" r="17" fill="black"/>
      <circle cx="181" cy="180" r="17" fill="black"/>
      <polygon points="150,226 136,212 164,212" fill="black"/>
      <path d="M 131,234 Q 150,249 169,234" stroke="black" stroke-width="8" fill="none" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="#2F6EF4"/>
  <g transform="translate(182,196) scale(2.2)">
    <rect width="300" height="300" fill="#FFFFFF" mask="url(#neppy-cat-icon)"/>
  </g>
</svg>
