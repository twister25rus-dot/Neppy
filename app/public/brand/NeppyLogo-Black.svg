<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Neppy</title>
  <!-- Head + ears are unioned through a mask (white = keep); eyes, nose and
       mouth are punched out (black = cut) so the mark reads on any background.
       Ear tips sit ABOVE the head rather than out to the sides — placed to the
       side, only a thin blade protrudes past the circle. Outer ear bases are
       tucked just inside the circle so the silhouette has no nicks. -->
  <defs>
    <mask id="neppy-cat">
      <rect width="300" height="300" fill="black"/>
      <circle cx="150" cy="186" r="92" fill="white"/>
      <polygon points="72,140 95,36 152,98" fill="white"/>
      <polygon points="228,140 205,36 148,98" fill="white"/>
      <circle cx="119" cy="180" r="17" fill="black"/>
      <circle cx="181" cy="180" r="17" fill="black"/>
      <polygon points="150,226 136,212 164,212" fill="black"/>
      <path d="M 131,234 Q 150,249 169,234" stroke="black" stroke-width="8" fill="none" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="300" height="300" fill="#000000" mask="url(#neppy-cat)"/>
</svg>
